# The dharness gate (ESLint, react-doctor, fallow) runs from .dharness/lefthook.yml.
extends:
  - .dharness/lefthook.yml

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,tsx,json,yml,css,html}'
      run: bunx prettier --check {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: bun run typecheck

pre-push:
  jobs:
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional commits
      run: bunx commitlint --edit {1}
