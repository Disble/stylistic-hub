pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,ts,tsx,json,yml,css,html}'
      run: bunx prettier --check {staged_files}
    - name: lint
      glob: '*.{js,ts,tsx}'
      run: bunx eslint {staged_files}
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: bun run typecheck

pre-push:
  jobs:
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional commits
      run: bunx commitlint --edit {1}
