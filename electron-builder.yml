appId: com.disble.stylistic-hub
productName: Stylistic Hub
directories:
  output: release
files:
  - out/**
  - '!out/addin/**'
  - resources/**
  # Word reads the add-in manifest from a real path, so the add-in stays outside the asar archive.
  - '!resources/addin/**'
  - '!resources/word/**'
  - package.json
extraResources:
  # The production copy from scripts/stage-prod-addin.ts, under its own add-in id.
  - from: out/addin
    to: addin
  - from: resources/word
    to: word
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: StylisticHub-Setup-${version}.${ext}
