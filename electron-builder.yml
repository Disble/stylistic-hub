appId: com.disble.stylistic-hub
productName: Stylistic Hub
directories:
  output: release
files:
  - out/**
  - resources/**
  # Word reads the add-in manifest from a real path, so the add-in stays outside the asar archive.
  - '!resources/addin/**'
  - package.json
extraResources:
  - from: resources/addin
    to: addin
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: StylisticHub-Setup-${version}.${ext}
