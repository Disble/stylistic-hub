appId: com.disble.stylistic-hub
productName: Stylistic Hub
# The only native module (pi-tui) ships prebuilt N-API binaries; rebuilding for Electron left them byte-identical.
npmRebuild: false
directories:
  output: release
files:
  - out/**
  # Stale add-in staging is never packed: the installer carries no add-in (odd/tasks/catalog-only-word.md S1).
  - '!out/addin/**'
  # The staged Word directory is packed as real files below, not inside the asar archive.
  - '!out/word/**'
  - resources/**
  - '!resources/addin/**'
  # Word reads the loader from a real path, so it stays outside the asar archive.
  - '!resources/word/**'
  - package.json
extraResources:
  # The staged Word directory from scripts/stage-word.ts: the loader plus its trigger document.
  - from: out/word
    to: word
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: StylisticHub-Setup-${version}.${ext}
