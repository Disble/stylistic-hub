# Checks every push and pull request, diffs the API v1 contract against the last server release, and on a
# push to dev (beta) or main (stable) releases the server and the hub with semantic-release
# (docs/development.md#continuous-integration), then writes those releases into the catalog (job catalog-entry).
# The dharness gate stays local: it is not built for CI.
name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  # The lefthook hooks call the local-only dharness binary; CI runs the same checks as steps instead.
  LEFTHOOK: '0'
  BUN_VERSION: 1.4.1

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `bun run check` minus coverage: the coverage tiers resolve through the dharness binary, so they are
      # enforced by the local gate only (docs/development.md#continuous-integration).
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:word
      - run: bun run build

  api-contract:
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.33.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: API v1 of the last server release and of this commit
        shell: bash
        run: |
          # The nearest server release this commit descends from (a hotfix from main is not compared with a dev beta).
          base_tag=$(git describe --tags --abbrev=0 --match 'server-v*' HEAD)
          echo "Comparing against $base_tag"
          base=node_modules/.cache/openapi-base
          mkdir -p "$base"
          git archive "$base_tag" src | tar -x -C "$base"
          bun scripts/openapi-doc.ts "$base" base.json
          bun scripts/openapi-doc.ts . head.json
      - name: Fail on a breaking change
        shell: bash
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar -xz oasdiff
          ./oasdiff breaking base.json head.json --fail-on ERR

  release-server:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: [check, api-contract]
    runs-on: windows-latest
    concurrency: release-${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run release:server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs component.json of the server artifact (docs/signed-releases.md).
          STYLISTIC_COMPONENT_KEY: ${{ secrets.STYLISTIC_COMPONENT_KEY }}

  release-hub:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: release-server
    runs-on: windows-latest
    # One group for both release jobs, so a later push's server release never races this hub release.
    concurrency: release-${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, which includes the server release commit pushed by the previous job.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The installer carries no add-in: Word loads the downloaded module (odd/tasks/catalog-only-word.md S1),
      # so the hub release never checks out or builds the sibling add-in.
      - run: bun install --frozen-lockfile
      - run: bun run release:hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer's component.json (scope stylistic-hub), like the server's.
          STYLISTIC_COMPONENT_KEY: ${{ secrets.STYLISTIC_COMPONENT_KEY }}

  catalog-entry:
    # Writes the entries of the server and hub releases into catalog/catalog.source.json on main through a pull
    # request (odd/tasks/catalog-auto-update.md S3-S4). A beta one merges itself and dispatches the Catalog
    # workflow, because a merge made with GITHUB_TOKEN triggers no push workflow; a stable one waits for review.
    # Opening the PR needs the repository setting "Allow GitHub Actions to create and approve pull requests".
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    needs: release-hub
    runs-on: ubuntu-latest
    concurrency: catalog-entry
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch head, with the release commits the previous jobs pushed: its versions name the releases.
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: catalog-main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Write the released entries and open the catalog pull request
        run: |
          set -euo pipefail
          changed=()
          # Plain assignments, so a version that cannot be read fails the job instead of looking unreleased.
          server=$(jq -er .version src/backend/package.json)
          hub=$(jq -er .version package.json)
          for tag in "server-v$server" "hub-v$hub"; do
            if ! gh release view "$tag" >/dev/null 2>&1; then echo "$tag: no release"; continue; fi
            dir="$RUNNER_TEMP/$tag"
            gh release download "$tag" --pattern component.json --dir "$dir" --clobber
            assets=()
            while IFS= read -r name; do assets+=(--asset "$name"); done \
              < <(gh release view "$tag" --json assets --jq '.assets[].name')
            result=$(bun scripts/catalog/catalog-entry.ts --source catalog-main/catalog/catalog.source.json \
              --component "$dir/component.json" --publisher stylistic-hub \
              --release "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" "${assets[@]}")
            echo "$tag: $result"
            if [ "$result" = changed ]; then changed+=("$tag"); fi
          done
          if [ ${#changed[@]} -eq 0 ]; then echo 'The catalog already lists these releases.'; exit 0; fi
          title="chore(catalog): list ${changed[*]}"
          branch="catalog/$(IFS=+; echo "${changed[*]}")"
          cd catalog-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Written by the catalog-entry job of run $GITHUB_RUN_ID from the releases ${changed[*]}."
          fi
          if [ "$GITHUB_REF_NAME" = dev ]; then
            gh pr merge "$branch" --squash --delete-branch
            gh workflow run catalog.yml --ref main
          fi
